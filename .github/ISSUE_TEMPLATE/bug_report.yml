name: Bug report
description: Report a defect in changegate
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** include real credentials, private repository
        contents, or personal information. Use synthetic examples.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The command, the diff shape, the expected verdict, and the actual verdict.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A minimal patch/diff or a short list of files that reproduces the issue.
      placeholder: |
        changegate check --patch minimal.diff
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: changegate version / commit
      placeholder: "0.1.0 or git sha"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: "3.12.4 on Ubuntu 24.04"
    validations:
      required: true
